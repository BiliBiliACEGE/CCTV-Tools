[package]
name = "cctv-toolbox"
version = "2.0.0"
description = "央视工具箱 —— 片库视频下载 / 栏目往期 / 听音音频 / 视频预览"
authors = ["cctv-toolbox"]
edition = "2021"
rust-version = "1.77"

[lib]
# Windows 上 lib 名必须与 bin 名不同，见 rust-lang/cargo#8519
name = "cctv_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "fs",
    "net",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "deflate",
    "json",
    "stream",
    "native-tls",
] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

regex = "1"
once_cell = "1"
url = "2"
base64 = "0.22"
md5 = "0.7"
thiserror = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
